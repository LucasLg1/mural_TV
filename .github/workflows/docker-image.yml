name: Docker Image CI

on:
  push:
    branches: ["homologacao"]
  workflow_dispatch:

env:
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_HML }}
  NAMESPACE: thalamus-hml
  IMAGE_NAME: devroboflex/thalamus-mural-tv
  IMAGE_TAG: hml

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build imagem Docker
        run: docker build . -t "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Push imagem Docker
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Configurar kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Reiniciar deployment
        run: |
          kubectl -n "$NAMESPACE" rollout restart deployment/thalamus-mural-tv
          kubectl -n "$NAMESPACE" rollout status deployment/thalamus-mural-tv --timeout=5m
