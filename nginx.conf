server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML, CSS e JS mudam a cada deploy e usam sempre o mesmo nome.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
