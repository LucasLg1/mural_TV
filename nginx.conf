server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS e CSS do build têm nome com hash: podem ficar em cache por um ano.
    location ^~ /app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O conteúdo editável e o HTML que aponta para os arquivos novos não podem cachear.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
